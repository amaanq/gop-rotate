[package]
name        = "gop-rotate"
version     = "0.1.0"
edition     = "2024"
description = "UEFI driver to rotate the firmware text console on sideways portrait panels"
readme      = "README.md"
repository  = "https://github.com/amaanq/gop-rotate"
license     = "MIT"
keywords    = [ "gpd", "rotation", "systemd-boot", "uefi" ]
categories  = [ "embedded", "no-std" ]

# The test harness links std, whose panic handler collides with the driver's.
[[bin]]
bench = false
name  = "gop-rotate"
path  = "src/main.rs"
test  = false

[dependencies]
uefi     = { version = "0.41.0", features = [ "alloc", "global_allocator" ] }
uefi-raw = "0.17.0"

[dependencies.noto-sans-mono-bitmap]
version          = "0.4.0"
default-features = false
features         = [
  "regular",
  "size_32",
  "unicode-basic-latin",
  "unicode-latin-1-supplement",
  "unicode-specials",
]

[lints.clippy]
cargo       = { level = "warn", priority = -1 }
nursery     = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"

arbitrary_source_item_ordering = "allow"
arithmetic_side_effects        = "allow"
implicit_return                = "allow"
indexing_slicing               = "allow"
inline_modules                 = "allow"
let_underscore_must_use        = "allow"
let_underscore_untyped         = "allow"
missing_docs_in_private_items  = "allow"
question_mark_used             = "allow"
separated_literal_suffix       = "allow"
single_call_fn                 = "allow"

[profile.release]
opt-level     = "s"
strip         = "symbols"
lto           = "thin"
panic         = "abort"
codegen-units = 1
